services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: bukuagenda
      POSTGRES_PASSWORD: bukuagendapassword
      POSTGRES_DB: bukuagenda
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bukuagenda -d bukuagenda"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    ports:
      - "3210:3210"
    environment:
      DATABASE_URL: "postgresql://bukuagenda:bukuagendapassword@db:5432/bukuagenda"
      SESSION_SECRET: "produksi-buku-agenda-secret-key-32-chars-minimal"
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
